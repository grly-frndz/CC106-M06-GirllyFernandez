
{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link rel="stylesheet"
          href="{% static 'registration/style.css' %}">
</head>
<body>

    <h1>Edit Student Record</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Student ID:</label>
        <input type="text" name="student_id"
               value="{{ student.student_id }}" required>
        <br><br>

        <label>First Name:</label>
        <input type="text" name="first_name"
               value="{{ student.first_name }}" required>
        <br><br>

        <label>Last Name:</label>
        <input type="text" name="last_name"
               value="{{ student.last_name }}" required>
        <br><br>

        <label>Gender:</label>
        <input type="text" name="gender"
               value="{{ student.gender }}" required>
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="date_of_birth"
               value="{{ student.date_of_birth|date:'Y-m-d' }}" required>
        <br><br>

        <label>Contact Number:</label>
        <input type="text" name="contact_no"
               value="{{ student.contact_no }}" required>
        <br><br>

        <button type="submit">Update Student</button>

        <a href="{% url 'student_list' %}">Cancel</a>

    </form>

</body>
</html>
