{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <link rel="stylesheet" href="{% static 'registration/style.css' %}">
    <title>Confirm Delete</title>
</head>
<body>
    <h1>Confirm Delete</h1>

    <p>Are you sure you want to delete
        <strong>
            {{ student.first_name }} {{ student.last_name }}
        </strong>
        ({{ student.student_id }})?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete Student</button>
        <a href="{% url 'student_detail' student.pk %}">Cancel</a>
    </form>
</body>
</html>
